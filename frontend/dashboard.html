<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOAR Central Automation & Cybersecurity Audit Dashboard</title>
    <link rel="stylesheet" href="./style_dashboard.css">
    <script src="./config.js"></script>
    <script src="./env.js"></script>
    <script src="./app_dashboard.js" defer></script>
</head>
<body>

<div class="navbar">
    🛡️ SOAR Central Automation & Cybersecurity Audit Dashboard
</div>

<div class="container">

    <div class="stats-grid">
        <div class="card">
            <h3>Total Logged Events</h3>
            <p id="totalEvents">0</p>
        </div>
        <div class="card">
            <h3>Successful Authentications</h3>
            <p id="successEvents" class="txt-success">0</p>
        </div>
        <div class="card danger">
            <h3>Failed Attempts (Brute-Force Vector)</h3>
            <p id="failedEvents" class="txt-danger">0</p>
        </div>
    </div>

    <div class="table-header">
        <h2>📋 Real-Time Event Logs (SIEM Ingestion Stream)</h2>
        <button id="generateReportBtn" class="btn">📊 Generate S3 Audit Report</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Event ID</th>
                <th>Username</th>
                <th>Audit Timestamp</th>
                <th>Auth Status</th>
                <th>Risk Level</th>
                <th>IP Address</th> <th>Detailed Forensic Message</th>
            </tr>
        </thead>
        <tbody id="logTableBody">
            </tbody>
    </table>

</div>

</body>
</html>
