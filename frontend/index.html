<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Access Control - SIEM Emulator</title>
    <link rel="stylesheet" href="./style_login.css">
    
    <script src="./config.js"></script>
    <script src="./env.js"></script>
    
    <script src="./app_login.js" defer></script>
</head>
<body>

<div class="login-card">
    <h2>🔒 Secure Portal Access</h2>
    <form id="authForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter pool username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit">Log In</button>
    </form>
    
    <div id="feedback" class="alert"></div>
    <a href="./dashboard.html" class="nav-link">📊 Open SOAR Audit Dashboard →</a>
</div>

</body>
</html>
